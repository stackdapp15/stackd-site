<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackd</title>
<style>
  :root { --bg: #0B211A; --text: #E4F5EC; --muted: #8FB8A3; --pop: #C6F432; --deep: #0E2A1F; }
  body { background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 16px; }
  main { max-width: 560px; margin: 0 auto; text-align: center; }
  h1 { font-size: 44px; margin: 16px 0 4px; letter-spacing: -1px; }
  .tag { color: var(--pop); font-weight: 700; font-size: 20px; margin: 0 0 16px; }
  p { color: var(--muted); }
  .coin { width: 88px; height: 88px; border-radius: 22px; background: var(--deep); display: inline-flex; align-items: center; justify-content: center; }
  .coin span { width: 60px; height: 60px; border-radius: 50%; background: var(--pop); display: block; }
  nav { margin-top: 32px; display: flex; gap: 20px; justify-content: center; }
  a { color: var(--pop); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="coin" aria-hidden="true"><span></span></div>
  <h1>Stackd</h1>
  <p class="tag">Budget. Stack. Crush debt.</p>
  <p>Know what you're good for every day, watch your savings stack up, and get a step-by-step plan to be debt-free. Your data stays on your phone.</p>
  <p>Coming soon to the App Store.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy-policy.html">Privacy policy</a>
  </nav>
</main>
</body>
</html>
